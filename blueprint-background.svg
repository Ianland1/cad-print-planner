<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <title>Decorative CAD drawings with dimension lines and millimeter markings</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 0 L 0 4 L 8 8" fill="none" stroke="#B6DFFF" stroke-width="1"/>
    </marker>
  </defs>

  <g fill="none" stroke="#B6DFFF" stroke-width="1.2" opacity="0.32">
    <!-- Plate: an orthographic view with mounting holes and center lines. -->
    <rect x="70" y="180" width="120" height="200" rx="12"/>
    <circle cx="94" cy="204" r="12"/>
    <circle cx="166" cy="204" r="12"/>
    <circle cx="94" cy="356" r="12"/>
    <circle cx="166" cy="356" r="12"/>
    <rect x="112" y="236" width="36" height="88" rx="18"/>
    <path d="M 130 158 V 402 M 48 280 H 212" stroke-dasharray="12 5 2 5"/>
    <path d="M 70 170 V 138 M 190 170 V 138 M 60 180 H 28 M 60 380 H 28"/>
    <path d="M 70 148 H 190 M 38 180 V 380" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 176 194 L 214 156 H 258"/>

    <!-- Circular end view with bore, pitch circle and center marks. -->
    <circle cx="1290" cy="210" r="66"/>
    <circle cx="1290" cy="210" r="42" stroke-dasharray="5 5"/>
    <circle cx="1290" cy="210" r="20"/>
    <circle cx="1290" cy="168" r="6"/>
    <circle cx="1332" cy="210" r="6"/>
    <circle cx="1290" cy="252" r="6"/>
    <circle cx="1248" cy="210" r="6"/>
    <path d="M 1204 210 H 1376 M 1290 124 V 296" stroke-dasharray="12 5 2 5"/>
    <path d="M 1224 282 V 316 M 1356 282 V 316"/>
    <path d="M 1224 306 H 1356" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- Isometric block, like a small CAD part on a drawing sheet. -->
    <path d="M 1220 620 L 1310 568 L 1390 614 L 1300 666 Z"/>
    <path d="M 1220 620 V 710 L 1300 756 L 1390 704 V 614 M 1300 666 V 756"/>
    <path d="M 1230 594 L 1214 566 M 1310 552 L 1294 524"/>
    <path d="M 1220 576 L 1300 530" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 1400 614 H 1424 M 1400 704 H 1424"/>
    <path d="M 1414 614 V 704" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 1210 756 H 1396 M 1300 548 V 784" stroke-dasharray="12 5 2 5" opacity="0.6"/>

    <!-- A quarter-circle and extension lines add another drafting detail. -->
    <path d="M 58 734 H 202 M 58 734 V 590 M 58 630 A 104 104 0 0 1 162 734"/>
    <path d="M 58 734 L 132 660" marker-end="url(#arrow)"/>
    <path d="M 42 718 L 74 750 M 42 750 L 74 718"/>

    <!-- Short scale ticks, kept decorative and outside the app panels. -->
    <path d="M 52 882 H 242 M 52 872 V 892 M 76 878 V 886 M 100 878 V 886 M 124 878 V 886 M 148 872 V 892 M 172 878 V 886 M 196 878 V 886 M 220 878 V 886 M 242 872 V 892"/>
  </g>

  <g fill="#B6DFFF" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1" opacity="0.5">
    <text x="130" y="136" text-anchor="middle">60.00 mm</text>
    <text x="24" y="280" text-anchor="middle" transform="rotate(-90 24 280)">100.00 mm</text>
    <text x="218" y="150">⌀12</text>
    <text x="1290" y="330" text-anchor="middle">⌀66.00 mm</text>
    <text x="1244" y="542" transform="rotate(-30 1244 542)">80.00</text>
    <text x="1428" y="660" text-anchor="middle" transform="rotate(-90 1428 660)">40.00</text>
    <text x="106" y="668">R52</text>
    <text x="52" y="912">0</text>
    <text x="142" y="912">50</text>
    <text x="226" y="912">100</text>
    <text x="252" y="886">mm</text>
  </g>
</svg>
